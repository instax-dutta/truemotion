name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm test
      - name: Verify publishable tarball
        run: node scripts/verify-tarball.mjs
      - name: Validate state schemas (current and legacy)
        run: |
          node bin/truemotion.mjs validate-state --state examples/pro-out/state.json
          cp examples/pro-out/state.json /tmp/tm-legacy-state.json
          node -e "const fs=require('fs');const p='/tmp/tm-legacy-state.json';const s=JSON.parse(fs.readFileSync(p));delete s.schemaVersion;fs.writeFileSync(p,JSON.stringify(s))"
          node bin/truemotion.mjs validate-state --state /tmp/tm-legacy-state.json

  golden:
    runs-on: ubuntu-latest
    env:
      TRUEMOTION_GOLDEN: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Install pinned Chromium
        run: node node_modules/playwright-core/cli.js install chromium
      - name: Run golden-frame regression
        run: npm test
      - name: Run combined-token MCP end-to-end test
        run: npm run test:e2e
      - name: Run SIGKILL crash-resume test
        run: npm run test:crash
      - name: Run audio + segmented resume test
        run: npm run test:audio-resume
      - name: Verify CSP blocks external requests
        run: npm run test:csp
      - name: MCP schema rejection and skill cache invalidation
        run: npm run test:mcp-schema
      - name: Scene reorder, render-setting and component resume rejection
        run: |
          npm run test:scene-order
          npm run test:settings-resume
          npm run test:component-resume
      - name: Concurrent MCP write safety
        run: |
          npm run test:concurrent
          npm run test:contention
      - name: Multi-minute A/V drift check
        run: AV_SCENES=10 npm run bench:av
